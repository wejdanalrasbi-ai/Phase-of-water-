<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر حالات الماء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4f7;--surface:#fff;--ink:#12232e;--mute:#566b78;--line:#d3dfe6;--ice:#38b6dc;--water:#1f6fd1;--steam:#8a73dd;--heat:#f0562a;--cool:#1c93c7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a22;--surface:#14262f;--ink:#e6f1f6;--mute:#93aab6;--line:#26404c;--ice:#7fd8f0;--water:#4f93f0;--steam:#b7a6f2;--heat:#ff8257;--cool:#5cc4ec;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a22;--surface:#14262f;--ink:#e6f1f6;--mute:#93aab6;--line:#26404c;--ice:#7fd8f0;--water:#4f93f0;--steam:#b7a6f2;--heat:#ff8257;--cool:#5cc4ec;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 28px}
h1{margin:4px 0 0;font-size:26px;font-weight:900}
.sub{margin:0 0 12px;color:var(--mute);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.stagebox{display:flex;gap:10px;align-items:stretch}
#stage{flex:1;min-width:0;width:100%;height:auto;aspect-ratio:320/300;display:block}
.thermo{width:56px;position:relative;margin:6px 0}
.tube{position:absolute;inset:0 22px 0 auto;width:14px;right:20px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fill{position:absolute;bottom:0;left:0;right:0;background:var(--heat);transition:background .2s}
.tick{position:absolute;right:0;left:0;font-size:11px;color:var(--mute);display:flex;align-items:center;gap:3px;transform:translateY(50%)}
.tick i{flex:1;border-top:1px dashed var(--line)}
.read{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.temp{font-size:44px;font-weight:900;line-height:1;direction:ltr;unicode-bidi:isolate}
.chip{padding:3px 12px;border-radius:99px;font-weight:700;font-size:14px;color:#fff;background:var(--ice)}
.proc{margin:8px 0 0;font-weight:700;min-height:26px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bg);margin-top:10px}
.bar span{display:block;transition:width .15s}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:4px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;cursor:pointer;min-height:44px}
button:focus-visible,input:focus-visible{outline:3px solid var(--water);outline-offset:2px}
button[aria-pressed="true"]{color:#fff;border-color:transparent}
#bHeat[aria-pressed="true"]{background:var(--heat)}
#bCool[aria-pressed="true"]{background:var(--cool)}
#bStop[aria-pressed="true"]{background:var(--mute)}
.row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px}
input[type=range]{flex:1;accent-color:var(--heat)}
.presets{display:flex;gap:8px;margin-top:10px}
.presets button{flex:1;font-size:13px;padding:8px 4px;min-height:40px}
h2{font-size:16px;margin:0 0 8px}
.procs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.procs button{text-align:right;padding:8px 10px;line-height:1.3}
.procs small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.procs button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.procs button.on small{color:var(--surface);opacity:.8}
#curve{width:100%;height:auto;aspect-ratio:320/150;display:block}
.info{font-size:15px;margin:0}
.clr{float:left;font-size:12px;padding:3px 10px;min-height:0}
</style>
</head>
<body>
<div class="wrap">
<h1>مختبر حالات الماء</h1>
<p class="sub">سخّن الماء أو برّده وشاهد الجزيئات تتغير.</p>

<div class="card">
  <div class="stagebox">
    <canvas id="stage" width="640" height="600" aria-label="جزيئات الماء داخل كأس"></canvas>
    <div class="thermo" aria-hidden="true">
      <div class="tube"><div class="fill" id="fill"></div></div>
      <div class="tick" id="t100"><span>100°</span><i></i></div>
      <div class="tick" id="t0"><span>0°</span><i></i></div>
    </div>
  </div>
  <div class="read" style="margin-top:10px">
    <div class="temp" id="temp">0°م</div>
    <div class="chip" id="chip">جليد</div>
  </div>
  <p class="proc" id="proc" aria-live="polite"></p>
  <div class="bar" id="bar"><span id="fs" style="background:var(--ice)"></span><span id="fl" style="background:var(--water)"></span><span id="fg" style="background:var(--steam)"></span></div>
  <div class="legend"><span>جامد (جليد)</span><span>سائل (ماء)</span><span>غاز (بخار)</span></div>
</div>

<div class="card">
  <div class="btns">
    <button id="bHeat" aria-pressed="false">🔥 تسخين</button>
    <button id="bStop" aria-pressed="true">⏸ إيقاف</button>
    <button id="bCool" aria-pressed="false">❄️ تبريد</button>
  </div>
  <div class="row"><label for="pw">قوة التسخين والتبريد</label><input id="pw" type="range" min="1" max="5" value="3"></div>
  <div class="presets">
    <button data-h="-42">جليد −20°</button>
    <button data-h="438">ماء 25°</button>
    <button data-h="3032">بخار 110°</button>
  </div>
</div>

<div class="card">
  <h2>اضغط على عملية لتشاهدها</h2>
  <div class="procs">
    <button id="p-melt" data-p="melt">انصهار<small>جامد ← سائل</small></button>
    <button id="p-freeze" data-p="freeze">تجمد<small>سائل ← جامد</small></button>
    <button id="p-boil" data-p="boil">تبخر<small>سائل ← غاز</small></button>
    <button id="p-cond" data-p="cond">تكثف<small>غاز ← سائل</small></button>
  </div>
</div>

<div class="card">
  <h2>منحنى الحرارة <button class="clr" id="clr">مسح</button></h2>
  <canvas id="curve" width="640" height="300" aria-label="منحنى درجة الحرارة مع الزمن"></canvas>
  <p class="info" id="info" style="margin-top:8px"></p>
</div>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var L=334,B=752,V=3012,HMIN=-126,HMAX=3100,N=70;
var H=-42,dir=0,power=3,t=0;
function temp(h){if(h<=0)return h/2.1;if(h<=L)return 0;if(h<=B)return (h-L)/4.18;if(h<=V)return 100;return 100+(h-V)/2}
function stg(h){if(h<=0)return 'ice';if(h<=L)return 'melt';if(h<B)return 'water';if(h<=V)return 'boil';return 'steam'}
function fr(h){var s=0,g=0;if(h<=0)s=1;else if(h<=L)s=1-h/L;if(h>V)g=1;else if(h>=B)g=(h-B)/(V-B);return {s:s,g:g,l:1-s-g}}

var P=[];for(var i=0;i<N;i++){var hx=52+(i%10)*24,hy=250-Math.floor(i/10)*16;P.push({hx:hx,hy:hy,x:hx,y:hy,vx:0,vy:0,f:.75+Math.random()*.5,rot:Math.random()*6.28,ph:Math.random()*6.28,m:0})}

var cv=$('stage'),cx=cv.getContext('2d');
var cc=$('curve'),cg=cc.getContext('2d');
var cs=getComputedStyle(document.documentElement);
function C(n){return cs.getPropertyValue(n).trim()}
var pts=[],MAXP=600,acc=0;

function names(){
  var s=stg(H);
  var m={ice:['جليد','var(--ice)'],melt:['جليد + ماء','var(--ice)'],water:['ماء سائل','var(--water)'],boil:['ماء + بخار','var(--steam)'],steam:['بخار','var(--steam)']}[s];
  return m;
}
function process(){
  var s=stg(H);
  if(dir>0&&s==='melt')return 'melt';
  if(dir<0&&s==='melt')return 'freeze';
  if(dir>0&&s==='boil')return 'boil';
  if(dir<0&&s==='boil')return 'cond';
  return '';
}
var TXT={
 melt:['انصهار: الجليد يتحول إلى ماء.','الحرارة تُستخدم لفك الروابط بين الجزيئات، لذلك تبقى الحرارة ثابتة عند 0° حتى يذوب كل الجليد.'],
 freeze:['تجمد: الماء يتحول إلى جليد.','الجزيئات تفقد حرارة وترتبط في شكل منتظم، وتبقى الحرارة ثابتة عند 0° حتى يتجمد كل الماء.'],
 boil:['تبخر: الماء يتحول إلى بخار.','الحرارة تحرر الجزيئات من بعضها، فتبقى الحرارة ثابتة عند 100° حتى يتحول كل الماء إلى بخار.'],
 cond:['تكثف: البخار يتحول إلى ماء.','الجزيئات تفقد حرارة فتتقارب وتصير قطرات، وتبقى الحرارة ثابتة عند 100° حتى يتكثف كل البخار.']
};
function plain(){
  var s=stg(H),d=dir>0?'يسخن':dir<0?'يبرد':'ساكن';
  if(s==='ice')return ['جليد صلب '+d,'الجزيئات في الجليد مرتبة ومتماسكة وتهتز في مكانها فقط. كلما سخّنته زاد اهتزازها.'];
  if(s==='water')return ['ماء سائل '+d,'جزيئات الماء السائل تنزلق فوق بعضها. كلما ارتفعت الحرارة زادت سرعتها.'];
  if(s==='steam')return ['بخار '+d,'جزيئات البخار متباعدة وتتحرك بسرعة في كل الاتجاهات.'];
  if(s==='melt')return ['ماء وجليد معاً','الحرارة ثابتة عند 0° ما دام الجليد والماء موجودين معاً.'];
  return ['ماء وبخار معاً','الحرارة ثابتة عند 100° ما دام الماء والبخار موجودين معاً.'];
}

function setDir(d){dir=d;$('bHeat').setAttribute('aria-pressed',d>0);$('bCool').setAttribute('aria-pressed',d<0);$('bStop').setAttribute('aria-pressed',d===0)}
$('bHeat').onclick=function(){setDir(1)};
$('bCool').onclick=function(){setDir(-1)};
$('bStop').onclick=function(){setDir(0)};
$('pw').oninput=function(){power=+this.value};
$('clr').onclick=function(){pts=[]};
document.querySelectorAll('.presets button').forEach(function(b){b.onclick=function(){H=+b.dataset.h;setDir(0);pts=[]}});
document.querySelectorAll('.procs button').forEach(function(b){b.onclick=function(){
  var p=b.dataset.p;pts=[];
  if(p==='melt'){H=1;setDir(1)}
  if(p==='freeze'){H=L-1;setDir(-1)}
  if(p==='boil'){H=B+1;setDir(1)}
  if(p==='cond'){H=V-1;setDir(-1)}
}});

function placeTicks(){
  function pc(x){return ((x+60)/190*100)}
  $('t0').style.bottom=pc(0)+'%';$('t100').style.bottom=pc(100)+'%';
}
placeTicks();

function step(dt){
  if(dir!==0){
    H+=dir*power*80*dt;
    if(H>=HMAX){H=HMAX;setDir(0)}
    if(H<=HMIN){H=HMIN;setDir(0)}
    acc+=dt;
    while(acc>=0.05){acc-=0.05;pts.push(temp(H));if(pts.length>MAXP)pts.shift()}
  }
  var T=temp(H),f=fr(H);
  var sN=Math.round(N*f.s),gN=Math.round(N*f.g);
  var lSp=Math.max(.5,.9+T*.012),gSp=Math.max(1.6,2.2+T*.02);
  for(var i=0;i<N;i++){
    var p=P[i];
    var m=i<sN?0:(i>=N-gN?2:1);
    if(m===0){
      var amp=Math.max(.4,1+(T+60)/45);
      var tx=p.hx+Math.sin(t*9+p.ph)*amp,ty=p.hy+Math.cos(t*8+p.ph)*amp;
      p.x+=(tx-p.x)*.18;p.y+=(ty-p.y)*.18;p.vx=p.vx*.5;p.vy=p.vy*.5;
      p.rot+=Math.sin(t*3+p.ph)*.01;
    }else{
      var sp=(m===1?lSp:gSp)*p.f;
      if(p.m===0||(p.vx===0&&p.vy===0)){var a0=Math.random()*6.28;p.vx=Math.cos(a0)*sp;p.vy=Math.sin(a0)*sp}
      var a=Math.atan2(p.vy,p.vx)+(Math.random()-.5)*(m===1?.5:.08);
      p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;
      p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;
      var top=m===1?142:28;
      if(p.x<32){p.x+=(32-p.x)*.2;p.vx=Math.abs(p.vx)}
      if(p.x>288){p.x+=(288-p.x)*.2;p.vx=-Math.abs(p.vx)}
      if(p.y<top){p.y+=(top-p.y)*.15;p.vy=Math.abs(p.vy)+.3}
      if(p.y>250){p.y=250;p.vy=-Math.abs(p.vy)}
      p.rot+=m===2?.05:.02;
    }
    p.m=m;
  }
}

function mol(p,col){
  var r=5.2;cx.globalAlpha=1;cx.fillStyle=col;cx.beginPath();cx.arc(p.x,p.y,r,0,7);cx.fill();
  cx.globalAlpha=.55;
  for(var k=-1;k<=1;k+=2){var a=p.rot+k*.91;cx.beginPath();cx.arc(p.x+Math.cos(a)*7.5,p.y+Math.sin(a)*7.5,3,0,7);cx.fill()}
  cx.globalAlpha=1;
}

function draw(){
  var f=fr(H),T=temp(H);
  cx.setTransform(cv.width/320,0,0,cv.height/300,0,0);
  cx.clearRect(0,0,320,300);
  var ice=C('--ice'),wat=C('--water'),ste=C('--steam'),ink=C('--ink'),line=C('--line'),heat=C('--heat'),cool=C('--cool');
  // plate
  cx.fillStyle=line;cx.beginPath();cx.roundRect(14,264,292,12,6);cx.fill();
  if(dir!==0){
    var col=dir>0?heat:cool;
    cx.globalAlpha=.35+power*.1;cx.fillStyle=col;cx.beginPath();cx.roundRect(14,264,292,12,6);cx.fill();cx.globalAlpha=1;
    cx.font='16px sans-serif';cx.textAlign='center';
    for(var k=0;k<7;k++){cx.fillText(dir>0?'🔥':'❄️',34+k*42,294+Math.sin(t*6+k)*2)}
  }
  // liquid body
  var lvl=252-112*(1-f.g);
  if(f.g<1){cx.globalAlpha=.16;cx.fillStyle=f.s>0.5?ice:wat;cx.fillRect(22,lvl,276,252-lvl+8);cx.globalAlpha=1}
  // beaker
  cx.strokeStyle=ink;cx.globalAlpha=.65;cx.lineWidth=3;cx.lineJoin='round';
  cx.beginPath();cx.moveTo(20,20);cx.lineTo(20,248);cx.quadraticCurveTo(20,260,32,260);cx.lineTo(288,260);cx.quadraticCurveTo(300,260,300,248);cx.lineTo(300,20);cx.stroke();cx.globalAlpha=1;
  // particles
  for(var i=0;i<N;i++){var p=P[i];mol(p,p.m===0?ice:(p.m===1?wat:ste))}
}

function drawCurve(){
  var w=cc.width,h=cc.height;
  cg.setTransform(w/320,0,0,h/150,0,0);cg.clearRect(0,0,320,150);
  var line=C('--line'),mute=C('--mute'),heat=C('--heat'),ink=C('--ink');
  function Y(T){return 138-(T+60)/190*126}
  cg.font='10px Cairo,sans-serif';cg.fillStyle=mute;cg.strokeStyle=line;cg.lineWidth=1;cg.textAlign='left';
  [0,100].forEach(function(v){cg.setLineDash([4,4]);cg.beginPath();cg.moveTo(26,Y(v));cg.lineTo(316,Y(v));cg.stroke();cg.fillText(v+'°',2,Y(v)+3)});
  cg.setLineDash([]);
  cg.strokeStyle=ink;cg.globalAlpha=.4;cg.beginPath();cg.moveTo(26,8);cg.lineTo(26,142);cg.lineTo(316,142);cg.stroke();cg.globalAlpha=1;
  if(pts.length>1){
    cg.strokeStyle=heat;cg.lineWidth=2.5;cg.lineJoin='round';cg.beginPath();
    for(var i=0;i<pts.length;i++){var x=26+i/MAXP*290;if(i===0)cg.moveTo(x,Y(pts[i]));else cg.lineTo(x,Y(pts[i]))}
    cg.stroke();
    var lx=26+(pts.length-1)/MAXP*290;cg.fillStyle=heat;cg.beginPath();cg.arc(lx,Y(pts[pts.length-1]),4,0,7);cg.fill();
  }else{cg.fillStyle=mute;cg.textAlign='center';cg.fillText('اضغط تسخين أو تبريد ليظهر المنحنى',171,80)}
}

function ui(){
  var T=temp(H),f=fr(H),n=names(),pr=process();
  $('temp').textContent=T.toFixed(1)+'°م';
  var ch=$('chip');ch.textContent=n[0];ch.style.background=n[1];
  var pct=Math.max(0,Math.min(100,(T+60)/190*100));
  $('fill').style.height=pct+'%';$('fill').style.background=dir<0?'var(--cool)':'var(--heat)';
  $('fs').style.width=f.s*100+'%';$('fl').style.width=f.l*100+'%';$('fg').style.width=f.g*100+'%';
  var tx=pr?TXT[pr]:plain();
  $('proc').textContent=tx[0];$('info').textContent=tx[1];
  ['melt','freeze','boil','cond'].forEach(function(k){$('p-'+k).classList.toggle('on',pr===k)});
}

var last=performance.now();
function loop(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  step(dt);draw();drawCurve();ui();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
